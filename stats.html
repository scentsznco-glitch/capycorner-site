<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Capy Corner visits</title>
<style>
:root{--bg:#fff6e8;--ink:#4a3426;--muted:#7a5f4c;--accent:#ff6a3d;--line:rgba(74,52,38,.1)}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:linear-gradient(180deg,#fff6e8,#f3e2c7);color:var(--ink);min-height:100vh}
main{max-width:520px;margin:0 auto;padding:28px 18px 48px}
h1{font-size:1.45rem;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:.9rem;margin:0 0 22px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.card{background:rgba(255,255,255,.78);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.9);border-radius:18px;padding:16px 14px;box-shadow:0 10px 28px rgba(120,72,30,.1)}
.card.wide{grid-column:1/-1}
.lbl{font-size:.72rem;letter-spacing:.12em;font-weight:800;color:var(--accent);text-transform:uppercase}
.num{font-size:2rem;font-weight:800;margin-top:4px;letter-spacing:-.03em}
.row{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:.95rem}
.row:first-child{border-top:0}
.muted{color:var(--muted)}
.bar{height:8px;background:rgba(74,52,38,.08);border-radius:99px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#ffb347,#ff6a3d);border-radius:99px}
#err{display:none;padding:48px 18px;text-align:center}
#err h1{font-size:3rem;margin:0}
#ok{display:none}
.fresh{font-size:.8rem;color:var(--muted);margin-top:16px}
</style>
</head>
<body>
<div id="err"><h1>404</h1><p class="muted">Not found</p></div>
<main id="ok">
<h1>Capy Corner visits</h1>
<p class="sub">Live counts · America/New_York · refreshes every 30s</p>
<div class="grid">
  <div class="card"><div class="lbl">Today</div><div class="num" id="today">—</div></div>
  <div class="card"><div class="lbl">Last hour</div><div class="num" id="hour">—</div></div>
  <div class="card"><div class="lbl">All time</div><div class="num" id="total">—</div></div>
  <div class="card"><div class="lbl">App Store redirects</div><div class="num" id="redir">—</div></div>
  <div class="card wide"><div class="lbl">By source</div><div id="sources"></div></div>
  <div class="card wide"><div class="lbl">Clicks</div><div id="clicks"></div></div>
  <div class="card wide"><div class="lbl">Last 24 hours</div><div id="hours"></div></div>
</div>
<p class="fresh" id="fresh"></p>
</main>
<script>
(function(){
var NS="myj8hIO5K7rk0ugJVItKUbRHhbUHI4weSzyAkSKzNwc", AB="https://abacus.jasoncameron.dev";
var q=new URLSearchParams(location.search);
var k=q.get('k')||'';
if(k!==NS){document.getElementById('err').style.display='block';return}
document.getElementById('ok').style.display='block';
function partsET(d){
  var f=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',hourCycle:'h23'});
  var p={}; f.formatToParts(d||new Date()).forEach(function(x){p[x.type]=x.value});
  return p;
}
function hourKeys(n){
  var out=[], now=Date.now();
  for(var i=0;i<n;i++){
    var p=partsET(new Date(now-i*3600e3));
    out.push({key:'hr'+p.year+p.month+p.day+p.hour, label:p.month+'/'+p.day+' '+p.hour+':00', day:p.year+p.month+p.day});
  }
  return out;
}
async function get(key){
  try{
    var r=await fetch(AB+'/get/'+NS+'/'+key,{credentials:'omit'});
    if(!r.ok) return 0;
    var j=await r.json();
    return Number(j.value)||0;
  }catch(e){return 0}
}
async function refresh(){
  var srcs=['tiktok','instagram','inapp','ios','android','desktop'];
  var hk=hourKeys(24);
  var pe=partsET();
  var todayStr=pe.year+pe.month+pe.day;
  var keys=['vis','redir','clk_copy','clk_android'].concat(srcs.map(function(s){return 'src_'+s})).concat(hk.map(function(h){return h.key}));
  var vals={};
  for(var i=0;i<keys.length;i+=8){
    var batch=keys.slice(i,i+8);
    var got=await Promise.all(batch.map(async function(k){return [k, await get(k)]}));
    got.forEach(function(x){vals[x[0]]=x[1]});
    if(i+8<keys.length) await new Promise(function(r){setTimeout(r,400)});
  }
  var today=0, lastHour=vals[hk[0].key]||0;
  hk.forEach(function(h){ if(h.day===todayStr) today+=vals[h.key]||0 });
  document.getElementById('today').textContent=today;
  document.getElementById('hour').textContent=lastHour;
  document.getElementById('total').textContent=vals.vis||0;
  document.getElementById('redir').textContent=vals.redir||0;
  var maxS=Math.max(1); srcs.forEach(function(s){maxS=Math.max(maxS, vals['src_'+s]||0)});
  document.getElementById('sources').innerHTML=srcs.map(function(s){
    var n=vals['src_'+s]||0;
    var label={tiktok:'TikTok in-app',instagram:'Instagram in-app',inapp:'Other in-app',ios:'iPhone/iPad Safari',android:'Android',desktop:'Desktop'}[s];
    return '<div class="row"><span>'+label+'</span><b>'+n+'</b></div><div class="bar"><i style="width:'+(100*n/maxS)+'%"></i></div>';
  }).join('');
  document.getElementById('clicks').innerHTML=
    '<div class="row"><span>Copy link</span><b>'+(vals.clk_copy||0)+'</b></div>'+
    '<div class="row"><span>Android open button</span><b>'+(vals.clk_android||0)+'</b></div>';
  var maxH=Math.max(1); hk.forEach(function(h){maxH=Math.max(maxH, vals[h.key]||0)});
  document.getElementById('hours').innerHTML=hk.map(function(h){
    var n=vals[h.key]||0;
    return '<div class="row"><span class="muted">'+h.label+' ET</span><b>'+n+'</b></div><div class="bar"><i style="width:'+(100*n/maxH)+'%"></i></div>';
  }).join('');
  document.getElementById('fresh').textContent='Updated '+new Date().toLocaleTimeString('en-US',{timeZone:'America/New_York'})+' America/New_York';
}
refresh();
setInterval(refresh,30000);
})();
</script>
</body>
</html>
